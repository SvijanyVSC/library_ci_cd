# nom
name: e2e tests cypress et PHP
# declencheur
on:
  push:
    branches:
      - feature
  pull_request:
    branches:
      - feature
      - main
# environnement
jobs:
  build:
    # image unbuntu
    runs-on: ubuntu-latest
    # base de données
    services:
      # Service MySQL
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: ci_cd
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5      
    # etape : checkout code
    steps:
      - name: checkout recuperation du code
        uses: actions/checkout@v6
      #install de php
      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, intl, mbstring, zip
          tools: composer
      - name: installer les dépendances
        run: | 
          composer install
      - name: démarrer le serveur PHP
        run: |
          php -S 127.0.0.1:8000 -t public &
    

# job : build (environnement du projet)
      - name: installer les dépendances
        run: | 
          DATABASE_HOST=localhost
          DATABASE_PORT=3306
          DATABASE_USERNAME=root
          DATABASE_PASSWORD=rootpw
          DATABASE_NAME=ci_cd
          UPLOAD_DIRECTORY=public/assets/uploads
          UPLOAD_PUBLIC_PATH=/assets/uploads
          UPLOAD_SIZE_MAX=2097152
          UPLOAD_FORMAT_WHITE_LIST=["png","jpg","jpeg","webp"]          
# compiler le code
      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          build: npm run build
          start: npm run start
          wait-on: ' http://127.0.0.1:8000/'
# job : test (environnement du projet)
